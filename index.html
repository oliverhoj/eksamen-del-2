<!DOCTYPE html>
<html lang="dk">

<head>
    <title>Spilcaféen</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="icon" type="image/x-icon" href="./assets/img/favicon.ico">

    <!-- MAPS ONLY -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <link rel="stylesheet" href="/css/maps.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css">
    <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

    <!-- Ready to make the app ready to next semester? -->
    <!-- <link rel="manifest" href="/spilcafe-exam/manifest.json"> -->
    <meta name="theme-color" content="#bf171c">

    <script>
        //Det her det er godt for sitet, da det gør at alt bliver cachet 
        // bagved og man behøver kun loade hele sitet en gang.
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/spilcafe-exam/sw.js').then(reg => {
                    // registreret
                }).catch(() => {
                    // fejl ved registrering
                });
            });
        }
    </script>
</head>

<body>
    <header>
        <div class="header-top">
            <a href="/spilcafe-exam/">
                <img src="./assets/img/logo.webp" width="50" alt="logo">
            </a>

            <div class="searchAndFilters">
                <div class="search">


                    <div class="searchInput">
                        <div class="magnifier">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="lucide lucide-search-icon lucide-search">
                                <path d="m21 21-4.34-4.34" />
                                <circle cx="11" cy="11" r="8" />
                            </svg>
                        </div>
                        <input type="search" id="searchInput" onchange="filterGames()"
                            placeholder="Søg alle vores spil...">
                    </div>
                </div>
            </div>

            <!-- Skal de her evt i footer? -->
            <div class="selected-chips"></div>

        </div>


        <div class="filters">

            <div class="chip" data-filter="location"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" class="lucide lucide-map-pin-icon lucide-map-pin">
                    <path
                        d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0" />
                    <circle cx="12" cy="10" r="3" />
                </svg>
                <div class="location" id="locationData">Vælg lokation</div>
            </div>

            <div class="chip" data-filter="players">Antal spillere</div>
            <div class="chip" data-filter="time">Spilletid</div>
            <div class="chip" data-filter="difficulty">Sværhedsgrad</div>
            <div class="chip" data-filter="genre">Genre</div>

            <button type="button" id="clearFiltersChip" class="chip">
                Ryd alle filtre
            </button>
        </div>

        <div class="sub-filters-under">
            <!-- location -->
            <section id="app" class="locationsForm">
                <div id="map"></div>
                <div class="chips-container towns">
                    <div class="chip" data-location="alle">Alle</div>
                    <div class="chip" data-location="aarhus-fredensgade">Aarhus Fredensgade</div>
                    <div class="chip" data-location="aarhus-vestergade">Aarhus Vestergade</div>
                    <div class="chip" data-location="aalborg">Aalborg</div>
                    <div class="chip" data-location="kolding">Kolding</div>
                    <div class="chip" data-location="odense">Odense</div>
                </div>
            </section>

            <!-- players -->
            <div class="playersForm">
                <form method="GET">
                    <div id="debt-amount-slider">
                        <input type="radio" name="players" id="p-1" value="2" required>
                        <label for="p-1" data-debt-amount="2"></label>
                        <input type="radio" name="players" id="p-2" value="4" required>
                        <label for="p-2" data-debt-amount="4"></label>
                        <input type="radio" name="players" id="p-3" value="6" required>
                        <label for="p-3" data-debt-amount="6"></label>
                        <input type="radio" name="players" id="p-4" value="8" required>
                        <label for="p-4" data-debt-amount="8"></label>
                        <input type="radio" name="players" id="p-5" value="10" required>
                        <label for="p-5" data-debt-amount="10"></label>
                        <!-- <div id="debt-amount-pos"></div> -->
                    </div>
                </form>
            </div>


            <!-- time -->
            <div class="container timeForm">
                <!-- <h2>Spilletid (maks)</h2> -->
                <form>
                    <div class="radio-group">
                        <input type="radio" name="time" id="time-20" value="20" checked>
                        <label for="time-20">20 min</label>

                        <input type="radio" name="time" id="time-30" value="30">
                        <label for="time-30">30 min</label>

                        <input type="radio" name="time" id="time-60" value="60">
                        <label for="time-60">60 min</label>

                        <input type="radio" name="time" id="time-120" value="120">
                        <label for="time-120">120 min</label>

                        <div class="underline"></div>
                    </div>
                </form>
            </div>


            <!-- difficulty -->
            <div class="difficultyForm">
                <form>

                    <input type="radio" name="difficulty" id="diff-let" value="Let">

                <div class="chips">
                    <div class="chip" data-genre="Familie">Familie</div>
                    <div class="chip" data-genre="Strategi">Strategi</div>
                    <div class="chip" data-genre="Party">Party</div>
